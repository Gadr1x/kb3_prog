<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>Kavárna Vůně</title>
    <link rel="stylesheet" href="style.css">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
</head>
<body>
    <nav>
        <a href="index.html" class="logo">Kavárna Vůně</a>
        <a href="menu.html" current-page>Menu</a>
        <a href="o-nas.html">O nás</a>
        <a href="kontakt.html">Kontakt</a>
    </nav>
    <div class="container">
        <h1>Naše menu</h1>
        <section class="menu-section">
            <h2>Káva</h2>
            <div class="menu-item">
                <span class="name">Espresso</span>
                <span class="price">40 Kč</span>
                <span class="divider"></span>
            </div>
            <div class="menu-item">
                <span class="name">Americano</span>
                <span class="price">45 Kč</span>
                <span class="divider"></span>
            </div>
            <div class="menu-item">
                <span class="name">Latte</span>
                <span class="price">55 Kč</span>
                <span class="divider"></span>
            </div>
            <div class="menu-item">
                <span class="name">Cappuccino</span>
                <span class="price">55 Kč</span>
                <span class="divider"></span>
            </div>
        </section>
        <section class="menu-section">
            <h2>Studené nápoje</h2>
            <div class="menu-item">
                <span class="name">Studené latté</span>
                <span class="price">50 Kč</span>
                <span class="divider"></span>
            </div>
            <div class="menu-item">
                <span class="name">Ledová čokoláda</span>
                <span class="price">55 Kč</span>
                <span class="divider"></span>
            </div>
        </section>
        <section class="menu-section">
            <h2>Snídaně a občerstvení</h2>
            <div class="menu-item">
                <span class="name">Domácí dort</span>
                <span class="price">80 Kč</span>
                <span class="divider"></span>
            </div>
            <div class="menu-item">
                <span class="name">Koblížek</span>
                <span class="price">30 Kč</span>
                <span class="divider"></span>
            </div>
            <div class="menu-item">
                <span class="name">Čokodonut</span>
                <span class="price">70 Kč</span>
                <span class="divider"></span>
            </div>
        </section>
        <img src="img/kava.svg" alt="Obrázek kávy" loading="lazy" width="150" style="display: block; margin: 2rem auto 0; max-width: 100%; border-radius: 8px;">
        <img src="img/dort.svg" alt="Obrázek dortu" loading="lazy" width="150" style="display: block; margin: 2rem auto 0; max-width: 100%; border-radius: 8px;">
    </div>
</body>
</html>
